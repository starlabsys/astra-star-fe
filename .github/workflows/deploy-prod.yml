name: Next.js CI/CD

on:
  push:
    branches: [ prod ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
            node-version: '18.17.1'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js project
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}  # Sesuaikan jika ada environment lain
        run: npm run build

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build . -t ${{ secrets.DOCKER_USERNAME }}/star-fe:${IMAGE_TAG}
          docker push ${{ secrets.DOCKER_USERNAME }}/star-fe:${IMAGE_TAG}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/star-fe:${{ github.sha }}
            docker stop star-fe || true
            docker rm star-fe || true
            docker run -d --name star-fe -p 3003:3003 -v /home/ubuntu//star-fe/.env:/home/node/app/.env ${{ secrets.DOCKER_USERNAME }}/star-fe:${{ github.sha }}

      - name: Prune unused Docker images
        run: docker image prune -a -f
